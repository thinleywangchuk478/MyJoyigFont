name: Fontbakery Validation

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  fontbakery-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Python environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Fontbakery toolset
        run: |
          pip install --upgrade pip
          pip install fontbakery[googlefonts]

      - name: Run Google Fonts validation suite
        run: |
          fontbakery check-googlefonts fonts/ttf/ThinWangT_Joyig.ttf --ghmarkdown validation_summary.md

      - name: Publish Test Summary to GitHub
        if: always()
        run: |
          if [ -f validation_summary.md ]; then
            cat validation_summary.md >> $GITHUB_STEP_SUMMARY
          else
            echo "Fontbakery test failed execution before compiling summary." >> $GITHUB_STEP_SUMMARY
          fi
